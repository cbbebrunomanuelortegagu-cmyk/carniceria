<header class="site-header">
  <div class="navbar">
    <a class="brand" routerLink="/inicio" aria-label="EdenFarm, ir a Inicio">
      <span class="brand-mark" aria-hidden="true">EF</span>
      <span class="brand-name">EdenFarm</span>
    </a>

    <button
      class="menu-toggle"
      type="button"
      [attr.aria-expanded]="menuAbierto"
      aria-controls="primary-navigation"
      [attr.aria-label]="menuAbierto ? 'Cerrar menú' : 'Abrir menú'"
      (click)="alternarMenu()"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>

    <nav
      id="primary-navigation"
      class="navigation"
      [class.is-open]="menuAbierto"
      aria-label="Navegación principal"
    >
      <a
        routerLink="/inicio"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()"
      >
        Inicio
      </a>
      <a
        routerLink="/carnes-al-vacio"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        (click)="cerrarMenu()"
      >
        Carnes al vacío
      </a>
      <a routerLink="/pedidos" routerLinkActive="is-active" (click)="cerrarMenu()">Pedidos / Reservas</a>
      <a routerLink="/nosotros" routerLinkActive="is-active" (click)="cerrarMenu()">Nosotros</a>
      <a routerLink="/socios" routerLinkActive="is-active" (click)="cerrarMenu()">Sé socio</a>
      <a
        class="cart-link reservation-cart-link"
        routerLink="/carrito-reservas"
        [attr.aria-label]="'Carrito de pedidos: ' + paquetesReserva() + ' paquetes seleccionados'"
        (click)="cerrarMenu()"
      >
        <span>Carrito</span>
        <span class="cart-count" aria-live="polite">{{ paquetesReserva() }}</span>
      </a>
      @if (esTiendaHeredada()) {
        <a routerLink="/ventas" routerLinkActive="is-active" (click)="cerrarMenu()">Punto de Venta (POS)</a>
      <button
        class="cart-link"
        type="button"
        [attr.aria-label]="'Carrito: ' + cantidadCarrito() + (cantidadCarrito() === 1 ? ' producto' : ' productos')"
        (click)="abrirCarrito()"
      >
        <svg
          aria-hidden="true"
          viewBox="0 0 24 24"
          fill="none"
          xmlns="http://www.w3.org/2000/svg"
        >
          <path
            d="M3 4h2l2.1 10.1a2 2 0 0 0 2 1.6h8.8a2 2 0 0 0 1.9-1.4L22 8H6"
            stroke="currentColor"
            stroke-width="1.8"
            stroke-linecap="round"
            stroke-linejoin="round"
          />
          <circle cx="10" cy="20" r="1.3" fill="currentColor" />
          <circle cx="18" cy="20" r="1.3" fill="currentColor" />
        </svg>
        <span>Carrito</span>
        <span class="cart-count" aria-live="polite">{{ cantidadCarrito() }}</span>
      </button>
      }
    </nav>
  </div>
</header>
